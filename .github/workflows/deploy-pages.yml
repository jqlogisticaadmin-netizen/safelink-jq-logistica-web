name: Deploy SafeLink Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static site
        run: |
          test -s index.html
          test -s assets/css/styles.css
          test -s assets/js/config.js
          test -s assets/js/auth.js
          test -s assets/js/app.js
          node --check assets/js/config.js
          node --check assets/js/auth.js
          node --check assets/js/app.js
          if grep -R -n -E 'service_role|SUPABASE_SERVICE_ROLE_KEY|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----' index.html assets; then
            echo "Possible secret detected in public frontend files."
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
